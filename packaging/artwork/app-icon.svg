<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Slopometer gauge</title>
  <!-- The website's gauge mark, with the macOS icon canvas inset. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffffb"/><stop offset="1" stop-color="#f1f1e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#2a1636" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#paper)" filter="url(#shadow)"/>
  <g transform="translate(100 100) scale(12.875)">
    <path d="M10 44a22 22 0 0 1 44 0" fill="none" stroke="#2a1636" stroke-width="5" stroke-linecap="round"/>
    <path d="M14 44a18 18 0 0 1 9-15.6" fill="none" stroke="#488dff" stroke-width="7" stroke-linecap="round"/>
    <path d="M32 44 20 30" stroke="#ff8fb1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="32" cy="44" r="6" fill="#2a1636"/>
  </g>
</svg>
