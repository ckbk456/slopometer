<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470">
  <title>Slopometer: drag into Applications, then open it from there.</title>
  <!-- Finder draws the real app and Applications icons at (210, 270) and (510, 270).
       Keep their icons and filename-label areas free of baked-in substitutes. -->
  <defs>
    <clipPath id="title">
      <text x="360" y="131" text-anchor="middle" data-font="Fredoka" font-weight="650" font-size="60" letter-spacing="-1">Drag. Drop. Slop.</text>
    </clipPath>
    <g id="gauge">
      <path d="M10 44a22 22 0 0 1 44 0" fill="none" stroke="#2a1636" stroke-width="5" stroke-linecap="round"/>
      <path d="M14 44a18 18 0 0 1 9-15.6" fill="none" stroke="#488dff" stroke-width="7" stroke-linecap="round"/>
      <path d="M32 44 20 30" stroke="#ff8fb1" stroke-width="5" stroke-linecap="round"/>
      <circle cx="32" cy="44" r="6" fill="#2a1636"/>
    </g>
    <g id="spark"><path d="M0 -8 Q1 -1 8 0 Q1 1 0 8 Q-1 1 -8 0 Q-1 -1 0 -8Z"/></g>
  </defs>
  <rect width="720" height="470" fill="#e4eaf7"/>
  <path d="M0 0H720V157C550 185 498 129 356 150S107 188 0 145Z" fill="#fbfdf5" opacity=".48"/>
  <g transform="translate(27 12) scale(.5)"><use href="#gauge"/></g>
  <text x="66" y="38" data-font="Fredoka" font-weight="650" font-size="25" fill="#3730a3">Slopometer</text>
  <text x="682" y="35" text-anchor="end" data-font="BricolageGrotesque" font-size="12" font-weight="650" fill="#5b4a66">A tiny app for your Mac.</text>
  <text x="360" y="131" text-anchor="middle" data-font="Fredoka" font-weight="650" font-size="60" letter-spacing="-1" fill="#e4eaf7" stroke="#3730a3" stroke-width="1.6" paint-order="stroke">Drag. Drop. Slop.</text>
  <g clip-path="url(#title)"><path d="M75 111C124 102 138 122 194 114S275 103 324 112S407 121 460 111S553 105 650 115V151H75Z" fill="#3730a3"/></g>
  <text x="360" y="169" text-anchor="middle" data-font="BricolageGrotesque" font-size="18" font-weight="500" fill="#2a1636">Drag Slopometer into Applications.</text>
  <use href="#spark" transform="translate(94 210)" fill="#488dff"/>
  <use href="#spark" transform="translate(627 148) scale(1.1)" fill="#ff8fb1"/>
  <circle cx="604" cy="169" r="3" fill="#488dff"/>
  <circle cx="115" cy="230" r="3" fill="#ff8fb1"/>
  <path d="M137 271C123 246 155 216 187 224C196 202 237 211 245 231C277 223 292 259 271 275C282 302 253 318 229 309C197 328 161 316 159 298C133 305 123 285 137 271Z" fill="#93c5fd" opacity=".65"/>
  <path d="M302 270C329 237 375 292 415 262" fill="none" stroke="#3730a3" stroke-width="7" stroke-linecap="round"/>
  <path d="M396 258L419 260L412 282" fill="none" stroke="#3730a3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M331 239Q345 234 354 240" fill="none" stroke="#ff8fb1" stroke-width="5" stroke-linecap="round"/>
  <use href="#spark" transform="translate(383 222) scale(.6)" fill="#488dff"/>
  <path d="M0 391C29 389 22 368 50 371S66 402 96 395S129 371 161 384S205 402 236 388S265 378 299 391S345 399 372 387S409 377 439 391S478 398 506 384S546 375 575 389S613 402 645 388S686 377 720 388V470H0Z" fill="#488dff"/>
  <path d="M0 402C37 402 29 389 60 392S87 417 124 406S165 395 193 405S246 414 274 402S322 397 353 407S401 408 434 401S483 397 514 406S554 412 587 403S623 400 659 406S697 408 720 398V470H0Z" fill="#3730a3"/>
  <text x="360" y="432" text-anchor="middle" data-font="Fredoka" font-size="23" font-weight="600" fill="#fbfdf5">Then open it from Applications.</text>
  <text x="360" y="455" text-anchor="middle" data-font="BricolageGrotesque" font-size="13.5" font-weight="400" fill="#e4eaf7">Your daily slop lives in the menu bar.</text>
</svg>
