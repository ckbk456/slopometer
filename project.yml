name: Slopometer
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: 5U4584QFCQ
    CODE_SIGN_STYLE: Automatic
    # Semantic version shared by the app and widget; bump here, then `make generate`.
    MARKETING_VERSION: 0.8.0
    # Overridden by the Makefile with the commit count and short SHA of the build.
    CURRENT_PROJECT_VERSION: 1
    SLOPOMETER_COMMIT: unknown
packages:
  SlopometerCore:
    # Equivalent to the repository root, but the generated reference is not named after
    # the checkout folder, so every clone generates an identical project.
    path: Sources/..
targets:
  Slopometer:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Slopometer.entitlements
      - Shared
    dependencies:
      - package: SlopometerCore
      - target: SlopometerWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.slopometer.app
        PRODUCT_NAME: Slopometer
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Slopometer.entitlements
        ENABLE_APP_SANDBOX: YES
  SlopometerWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - SlopometerWidget.entitlements
      - Shared
    dependencies:
      - package: SlopometerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.slopometer.app.widget
        PRODUCT_NAME: SlopometerWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/SlopometerWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
schemes:
  Slopometer:
    build:
      targets:
        Slopometer: all
    run:
      config: Debug
fileGroups:
  - README.md
  - SPEC.md
  - SCOPE.md
  - ROADMAP.md
