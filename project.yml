name: Slopometer
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Required for Developer ID notarization; the sandbox entitlements are unchanged.
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: 5U4584QFCQ
    CODE_SIGN_STYLE: Automatic
    # Semantic version shared by the app and widget; bump here, then `make generate`.
    MARKETING_VERSION: 1.0.1
    # Overridden by the Makefile with the commit count and short SHA of the build.
    CURRENT_PROJECT_VERSION: 1
    SLOPOMETER_COMMIT: unknown
packages:
  SlopometerCore:
    # Equivalent to the repository root, but the generated reference is not named after
    # the checkout folder, so every clone generates an identical project.
    path: Sources/..
  # In-app updates. Pinned exactly; the Xcode workspace lockfile records the resolution.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Slopometer:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Slopometer.entitlements
      - Shared
    dependencies:
      - package: SlopometerCore
      - package: Sparkle
      - target: SlopometerWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.infinitex.slopometer
        PRODUCT_NAME: Slopometer
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Slopometer.entitlements
        ENABLE_APP_SANDBOX: YES
      configs:
        # Development builds check for updates only when asked, so a newer release
        # never offers to replace the build under test.
        Debug:
          SLOPOMETER_AUTOMATIC_UPDATE_CHECKS: NO
        Release:
          SLOPOMETER_AUTOMATIC_UPDATE_CHECKS: YES
  SlopometerWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - SlopometerWidget.entitlements
      - Shared
    dependencies:
      - package: SlopometerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.infinitex.slopometer.widget
        PRODUCT_NAME: SlopometerWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/SlopometerWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
schemes:
  Slopometer:
    build:
      targets:
        Slopometer: all
    run:
      config: Debug
fileGroups:
  - README.md
  - SPEC.md
  - SCOPE.md
  - ROADMAP.md
