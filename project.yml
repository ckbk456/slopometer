name: Slopometer
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SlopometerCore:
    path: .
targets:
  Slopometer:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Slopometer.entitlements
    dependencies:
      - package: SlopometerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.slopometer.app
        PRODUCT_NAME: Slopometer
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Slopometer.entitlements
        ENABLE_APP_SANDBOX: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
schemes:
  Slopometer:
    build:
      targets:
        Slopometer: all
    run:
      config: Debug
fileGroups:
  - README.md
  - SPEC.md
  - SCOPE.md
  - ROADMAP.md
  - docs
  - testing
